<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#6ec6ff" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>הַצַּעַד הָרִאשׁוֹן שֶׁלִּי</title>
  </head>
  <body>
    <div id="home" class="screen"></div>

    <div id="balls" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="balls-game">
        <div class="balls-prompt" id="bprompt"></div>
        <div class="balls-count" id="bcount"></div>
        <div class="balls-board" id="bboard"></div>
        <button class="count-aloud" id="bagain" hidden></button>
      </div>
    </div>
    <div id="teens" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="grid number-grid" id="tngrid"></div>
        <div class="detail">
          <div class="bignum" id="tnbig"></div>
          <div class="nname" id="tnname"></div>
          <div class="balls" id="tnballs"></div>
          <button class="count-aloud" id="tnplay"></button>
        </div>
      </div>
    </div>
    <div id="numbers" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="grid number-grid" id="ngrid"></div>
        <div class="detail">
          <div class="bignum" id="nbig"></div>
          <div class="nname" id="nname"></div>
          <div class="balls" id="nballs"></div>
          <button class="count-aloud" id="nplay"></button>
        </div>
      </div>
    </div>

    <div id="letters" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="grid" id="lgrid"></div>
        <div class="detail">
          <div class="lbig" id="lbig"></div>
          <div class="lname" id="lname"></div>
          <div class="lsnd" id="lsnd"></div>
          <button class="next-item" id="lnext"></button>
        </div>
      </div>
    </div>

    <div id="trace" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="trace-side">
          <div class="trace-families" id="tfamilies"></div>
          <div class="grid" id="tgrid"></div>
        </div>
        <div class="detail trace-detail">
          <div class="trace-title">
            <span class="trace-letter" id="tletter"></span>
            <span class="lname" id="tname"></span>
          </div>
          <svg id="tsvg" class="trace-svg" viewBox="0 -10 100 115" role="img" aria-label="trace">
            <g id="tdrawing"></g>
          </svg>
          <div class="trace-legend" id="tlegend"></div>
          <div class="trace-controls" id="tcontrols"></div>
        </div>
      </div>
    </div>

    <div id="colors" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="grid" id="cgrid"></div>
        <div class="detail">
          <div class="cbig" id="cbig"></div>
          <div class="cname" id="cname"></div>
          <div class="cexample" id="cexample"></div>
        </div>
      </div>
    </div>

    <div id="words" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split"><div class="grid" id="wgrid"></div></div>
      <div id="wdetail">
        <div class="wemo" id="wemo"></div>
        <div class="steps">
          <div class="step" id="st1"><small></small><span></span></div>
          <div class="step" id="st2"><small></small><span></span></div>
          <div class="step" id="st3"><small></small><span></span></div>
          <div class="step" id="st4"><small></small><span></span></div>
        </div>
        <div class="row2">
          <button class="btn" id="wreplay">🔁</button>
          <button class="btn" id="wclose">✖</button>
        </div>
      </div>
    </div>

    <div id="shapes" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="grid" id="shgrid"></div>
        <div class="detail">
          <div class="shbig" id="shbig"></div>
          <div class="cname" id="shname"></div>
        </div>
      </div>
    </div>

    <div id="lookalike" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="play" id="lookalikeplay"></div>
    </div>

    <div id="count" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="play" id="countplay"></div>
    </div>

    <div id="mix" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="play" id="mixplay"></div>
    </div>

    <div id="starts" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="play" id="startsplay"></div>
    </div>

    <div id="add" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="play" id="addplay"></div>
    </div>

    <div id="niqqud" class="screen pastel hidden">
      <button class="homebtn" data-home>🏠</button>
      <div class="split">
        <div class="grid" id="qgrid"></div>
        <div class="detail">
          <div class="niqqud-show">
            <div class="mouth-face" id="qface"></div>
            <div class="lbig" id="qbig"></div>
          </div>
          <div class="lname" id="qname"></div>
          <div class="lsnd" id="qsound"></div>
        </div>
      </div>
    </div>

    <div id="sky" class="screen hidden">
      <canvas id="c"></canvas>
      <div id="skyhud">
        <button id="quit"></button>
        <div id="timer"></div>
        <div id="score"></div>
        <div id="word"></div>
        <div id="side"></div>
        <div id="joy">
          <div id="knob"></div>
          <small>WASD</small>
        </div>
        <button id="punch">👊<small>K</small></button>
      </div>
      <div class="ov" id="pop"></div>
      <div class="ov" id="end"></div>
      <button id="skyhome" aria-label="Home">🏠</button>
      <div id="rotate">
        <button class="homebtn" data-home aria-label="Home">🏠</button>
        <div class="rotate-icon">📱↻</div>
        <div id="rotateText"></div>
      </div>
    </div>

    <div id="about"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

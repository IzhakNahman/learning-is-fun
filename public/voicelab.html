<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Voice lab</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f4f7fb; color: #222; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  h2 { font-size: 16px; margin: 20px 0 6px; }
  .bar { position: sticky; top: 0; background: #f4f7fb; padding: 8px 0; z-index: 2; border-bottom: 1px solid #ccd; }
  .bar label { margin-right: 10px; font-size: 14px; }
  .item { background: #fff; border-radius: 12px; padding: 8px 10px; margin: 8px 0; box-shadow: 0 1px 3px #0002; }
  .title { font-size: 22px; direction: rtl; text-align: left; }
  .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .play { font-size: 20px; padding: 8px 14px; border-radius: 10px; border: 0; background: #3b82f6; color: #fff; }
  .text { font-size: 22px; direction: rtl; min-width: 90px; }
  .mark { font-size: 20px; padding: 6px 10px; border-radius: 10px; border: 2px solid #ccd; background: #fff; }
  .mark.on { border-color: #111; background: #ffe9a8; }
  .lab { font-size: 13px; color: #667; width: 70px; }
  button.big { font-size: 16px; padding: 10px 16px; border-radius: 10px; border: 0; background: #16a34a; color: #fff; }
  textarea { width: 100%; height: 90px; margin-top: 8px; }
  #voiceinfo { font-size: 13px; color: #445; }
</style>
</head>
<body>
<h1>Voice lab – Hebrew</h1>
<p>Tap ▶ and listen. Mark: ✅ clear, 🤔 not clear, ❌ wrong. When done press <b>Copy results</b> and paste them in the chat.</p>
<div class="bar">
  <label>Voice: <select id="voice"></select></label>
  <label>Speed: <input id="rate" type="range" min="0.5" max="1.1" step="0.05" value="0.7" /> <span id="ratev">0.7</span></label>
  <div id="voiceinfo"></div>
</div>
<div id="list"></div>
<p><button class="big" id="copy">Copy results</button></p>
<textarea id="out" readonly placeholder="Results appear here"></textarea>
<script>

abel":"A","text":"מָ"},{"label":"B","text":"מַ"},{"label":"C","text":"מַא"}]},{"group":"Letter sounds","title":"נ (nun)","variants":[{"label":"A","text":"נָ"},{"label":"B","text":"נַ"},{"label":"C","text":"נַא"}]},{"group":"Letter sounds","title":"ס (samekh)","variants":[{"label":"A","text":"סָ"},{"label":"B","text":"סַ"},{"label":"C","text":"סַא"}]},{"group":"Letter sounds","title":"ע (ayin)","variants":[{"label":"A","text":"עָ"},{"label":"B","text":"עַ"},{"label":"C","text":"עַא"}]},{"group":"Letter sounds","title":"פּ (pe)","variants":[{"label":"A","text":"פָּ"},{"label":"B","text":"פַּ"},{"label":"C","text":"פַּא"}]},{"group":"Letter sounds","title":"פ (fe)","variants":[{"label":"A","text":"ףָ"},{"label":"B","text":"ףַ"},{"label":"C","text":"ףַא"}]},{"group":"Letter sounds","title":"צ (tsadi)","variants":[{"label":"A","text":"צָ"},{"label":"B","text":"צַ"},{"label":"C","text":"צַא"}]},{"group":"Letter sounds","title":"ק (qof)","variants":[{"label":"A","text":"קָ"},{"label":"B","text":"קַ"},{"label":"C","text":"קַא"}]},{"group":"Letter sounds","title":"ר (resh)","variants":[{"label":"A","text":"רָ"},{"label":"B","text":"רַ"},{"label":"C","text":"רַא"}]},{"group":"Letter sounds","title":"ש (shin)","variants":[{"label":"A","text":"שָׁ"},{"label":"B","text":"שַׁ"},{"label":"C","text":"שַׁא"}]},{"group":"Letter sounds","title":"ת (tav)","variants":[{"label":"A","text":"תָּ"},{"label":"B","text":"תַּ"},{"label":"C","text":"תַּא"}]},{"group":"Letter names","title":"א (alef)","variants":[{"label":"A","text":"אָלֶף"}]},{"group":"Letter names","title":"בּ (bet)","variants":[{"label":"A","text":"בֵּית"}]},{"group":"Letter names","title":"ב (vet)","variants":[{"label":"A","text":"וֵית"}]},{"group":"Letter names","title":"ג (gimel)","variants":[{"label":"A","text":"גִּימֶל"}]},{"group":"Letter names","title":"ד (dalet)","variants":[{"label":"A","text":"דָּלֶת"}]},{"group":"Letter names","title":"ה (he)","variants":[{"label":"A","text":"הֵא"}]},{"group":"Letter names","title":"ו (vav)","variants":[{"label":"A","text":"וָו"}]},{"group":"Letter names","title":"ז (zayin)","variants":[{"label":"A","text":"זַיִן"}]},{"group":"Letter names","title":"ח (het)","variants":[{"label":"A","text":"חֵית"}]},{"group":"Letter names","title":"ט (tet)","variants":[{"label":"A","text":"טֵית"}]},{"group":"Letter names","title":"י (yod)","variants":[{"label":"A","text":"יוֹד"}]},{"group":"Letter names","title":"כּ (kaf)","variants":[{"label":"A","text":"כַּף"}]},{"group":"Letter names","title":"כ (khaf)","variants":[{"label":"A","text":"חַף"}]},{"group":"Letter names","title":"ל (lamed)","variants":[{"label":"A","text":"לָמֶד"}]},{"group":"Letter names","title":"מ (mem)","variants":[{"label":"A","text":"מֵם"}]},{"group":"Letter names","title":"נ (nun)","variants":[{"label":"A","text":"נוּן"}]},{"group":"Letter names","title":"ס (samekh)","variants":[{"label":"A","text":"סָמֶךְ"}]},{"group":"Letter names","title":"ע (ayin)","variants":[{"label":"A","text":"עַיִן"}]},{"group":"Letter names","title":"פּ (pe)","variants":[{"label":"A","text":"פֵּא"}]},{"group":"Letter names","title":"פ (fe)","variants":[{"label":"A","text":"ףֵא"}]},{"group":"Letter names","title":"צ (tsadi)","variants":[{"label":"A","text":"צָדִי"}]},{"group":"Letter names","title":"ק (qof)","variants":[{"label":"A","text":"קוֹף"}]},{"group":"Letter names","title":"ר (resh)","variants":[{"label":"A","text":"רֵישׁ"}]},{"group":"Letter names","title":"ש (shin)","variants":[{"label":"A","text":"שִׁין"}]},{"group":"Letter names","title":"ת (tav)","variants":[{"label":"A","text":"תָּו"}]},{"group":"Words","title":"אַרְיֵה 🦁","variants":[{"label":"A (niqqud)","text":"אַרְיֵה"},{"label":"B (plain)","text":"אריה"}]},{"group":"Words","title":"בַּיִת 🏠","variants":[{"label":"A (niqqud)","text":"בַּיִת"},{"label":"B (plain)","text":"בית"}]},{"group":"Words","title":"גָּמָל 🐪","variants":[{"label":"A (niqqud)","text":"גָּמָל"},{"label":"B (plain)","text":"גמל"}]},{"group":"Words","title":"דָּג 🐟","variants":[{"label":"A (niqqud)","text":"דָּג"},{"label":"B (plain)","text":"דג"}]},{"group":"Words","title":"הַר 🏔️","variants":[{"label":"A (niqqud)","text":"הַר"},{"label":"B (plain)","text":"הר"}]},{"group":"Words","title":"וֶרֶד 🌹","variants":[{"label":"A (niqqud)","text":"וֶרֶד"},{"label":"B (plain)","text":"ורד"}]},{"group":"Words","title":"זֶבְרָה 🦓","variants":[{"label":"A (niqqud)","text":"זֶבְרָה"},{"label":"B (plain)","text":"זברה"}]},{"group":"Words","title":"חָתוּל 🐱","variants":[{"label":"A (niqqud)","text":"חָתוּל"},{"label":"B (plain)","text":"חתול"}]},{"group":"Words","title":"טָלֶה 🐑","variants":[{"label":"A (niqqud)","text":"טָלֶה"},{"label":"B (plain)","text":"טלה"}]},{"group":"Words","title":"יָד ✋","variants":[{"label":"A (niqqud)","text":"יָד"},{"label":"B (plain)","text":"יד"}]},{"group":"Words","title":"כֶּלֶב 🐶","variants":[{"label":"A (niqqud)","text":"כֶּלֶב"},{"label":"B (plain)","text":"כלב"}]},{"group":"Words","title":"לֵב ❤️","variants":[{"label":"A (niqqud)","text":"לֵב"},{"label":"B (plain)","text":"לב"}]},{"group":"Words","title":"מַיִם 💧","variants":[{"label":"A (niqqud)","text":"מַיִם"},{"label":"B (plain)","text":"מים"}]},{"group":"Words","title":"נָחָשׁ 🐍","variants":[{"label":"A (niqqud)","text":"נָחָשׁ"},{"label":"B (plain)","text":"נחש"}]},{"group":"Words","title":"סוּס 🐴","variants":[{"label":"A (niqqud)","text":"סוּס"},{"label":"B (plain)","text":"סוס"}]},{"group":"Words","title":"עַיִן 👁️","variants":[{"label":"A (niqqud)","text":"עַיִן"},{"label":"B (plain)","text":"עין"}]},{"group":"Words","title":"פִּיל 🐘","variants":[{"label":"A (niqqud)","text":"פִּיל"},{"label":"B (plain)","text":"פיל"}]},{"group":"Words","title":"צָב 🐢","variants":[{"label":"A (niqqud)","text":"צָב"},{"label":"B (plain)","text":"צב"}]},{"group":"Words","title":"קוֹף 🐵","variants":[{"label":"A (niqqud)","text":"קוֹף"},{"label":"B (plain)","text":"קוף"}]},{"group":"Words","title":"רַכֶּבֶת 🚂","variants":[{"label":"A (niqqud)","text":"רַכֶּבֶת"},{"label":"B (plain)","text":"רכבת"}]},{"group":"Words","title":"שֶׁמֶשׁ ☀️","variants":[{"label":"A (niqqud)","text":"שֶׁמֶשׁ"},{"label":"B (plain)","text":"שמש"}]},{"group":"Words","title":"תַּפּוּחַ 🍎","variants":[{"label":"A (niqqud)","text":"תַּפּוּחַ"},{"label":"B (plain)","text":"תפוח"}]}];
const LANG = "he-IL";
const marks = {};
const select = document.getElementById('voice');
const rate = document.getElementById('rate');
rate.oninput = () => (document.getElementById('ratev').textContent = rate.value);

function loadVoices() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().replace('_', '-').startsWith('he'));
  select.innerHTML = '';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = v.name + ' (' + v.lang + ')';
    select.appendChild(o);
  });
  document.getElementById('voiceinfo').textContent = voices.length ? '' : 'No Hebrew voice found on this phone – install one in Settings.';
  select._voices = voices;
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG;
  const v = (select._voices || [])[Number(select.value)];
  if (v) u.voice = v;
  u.rate = Number(rate.value);
  u.pitch = 1.1;
  setTimeout(() => speechSynthesis.speak(u), 80);
}

const list = document.getElementById('list');
let lastGroup = '';
ITEMS.forEach((item, n) => {
  if (item.group !== lastGroup) {
    lastGroup = item.group;
    const h = document.createElement('h2');
    h.textContent = item.group;
    list.appendChild(h);
  }
  const box = document.createElement('div');
  box.className = 'item';
  box.innerHTML = '<div class="title"></div>';
  box.querySelector('.title').textContent = item.title;
  item.variants.forEach((variant) => {
    const key = item.group + '|' + item.title + '|' + variant.label;
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('span');
    lab.className = 'lab';
    lab.textContent = variant.label;
    const play = document.createElement('button');
    play.className = 'play';
    play.textContent = '▶';
    play.onclick = () => speak(variant.text);
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = variant.text;
    row.append(lab, play, text);
    [['✅', 'good'], ['🤔', 'unclear'], ['❌', 'wrong']].forEach(([icon, value]) => {
      const b = document.createElement('button');
      b.className = 'mark';
      b.textContent = icon;
      b.onclick = () => {
        marks[key] = value;
        row.querySelectorAll('.mark').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
      };
      row.appendChild(b);
    });
    box.appendChild(row);
  });
  list.appendChild(box);
});

document.getElementById('copy').onclick = () => {
  const info = (select._voices || [])[Number(select.value)];
  const lines = ['Voice: ' + (info ? info.name + ' ' + info.lang : 'none') + ', speed ' + rate.value];
  Object.keys(marks).forEach((k) => lines.push(k + ' = ' + marks[k]));
  const out = document.getElementById('out');
  out.value = lines.join('\n');
  out.select();
  try { navigator.clipboard.writeText(out.value); } catch (e) {}
};
</script>
</body>
</html>
